const colorBg = {c1:'#F3EEFF',c2:'#EDFFF6',c3:'#FFF0EE',c4:'#FFF0F7',c5:'#FFFBEB',c6:'#EEF4FF'};
const colorFg = {c1:'#7C5CBF',c2:'#22A874',c3:'#E8503A',c4:'#E85D9C',c5:'#D97706',c6:'#2563EB'};

const grid = document.getElementById('mainGrid');
shapes.forEach(sh => {
  const card = document.createElement('div');
  card.className = `shape-card ${sh.color}`;
  card.style.background = colorBg[sh.color] || '#fff';
  card.setAttribute('tabindex', '0');
  card.innerHTML = `
    <div class="card-top">
      <div class="card-title">${sh.name.toUpperCase()}</div>
      <div class="shape-svg-wrap">
        <svg viewBox="0 0 130 120" xmlns="http://www.w3.org/2000/svg">${sh.svgPath}</svg>
      </div>
    </div>
    <div class="card-bottom">
      <div class="formula-line">Keliling: <span>${sh.formulas.keliling.text}</span></div>
      <div class="formula-line">Luas: <span>${sh.formulas.luas.text}</span></div>
      <div class="click-hint">👆 Klik untuk Menghitung!</div>
    </div>`;
  card.addEventListener('click', () => openModal(sh.id));
  card.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') openModal(sh.id); });
  grid.appendChild(card);
});

let currentShape = null, currentCalcType = null;

function openModal(id) {
  currentShape = shapes.find(s => s.id === id);
  const c = colorFg[currentShape.color];
  const bg = colorBg[currentShape.color];
  document.getElementById('modalHeader').innerHTML = `
    <div class="modal-icon" style="background:${bg}">
      <svg viewBox="0 0 130 120" width="34" height="28" xmlns="http://www.w3.org/2000/svg">${currentShape.svgPath}</svg>
    </div>
    <h2 style="color:${c}">${currentShape.name}</h2>`;
  document.getElementById('choiceScreen').style.display = '';
  document.getElementById('calcScreen').classList.remove('show');
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function openCalc(type) {
  currentCalcType = type;
  const f = currentShape.formulas[type];
  document.getElementById('calcBadge').innerHTML = `<span class="calc-type-badge ${type==='keliling'?'badge-keliling':'badge-luas'}">${type==='keliling'?'📐 Menghitung Keliling':'📏 Menghitung Luas'}</span>`;
  const c = colorFg[currentShape.color];
  document.getElementById('formulaDisplay').style.borderColor = c;
  document.getElementById('formulaDisplay').innerHTML = `<b>Rumus:</b> ${f.text}`;
  const fd = document.getElementById('inputFields');
  fd.innerHTML = '';
  f.inputs.forEach(inp => {
    fd.innerHTML += `<div class="input-group"><label for="inp_${inp.id}">📌 ${inp.label} (${inp.unit})</label><input type="number" id="inp_${inp.id}" placeholder="Masukkan nilai..." min="0" step="any"/></div>`;
  });
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('choiceScreen').style.display = 'none';
  document.getElementById('calcScreen').classList.add('show');
}

function backToChoice() {
  document.getElementById('choiceScreen').style.display = '';
  document.getElementById('calcScreen').classList.remove('show');
}

function hitung() {
  const f = currentShape.formulas[currentCalcType];
  const vals = {}; let valid = true;
  f.inputs.forEach(inp => {
    const el = document.getElementById('inp_' + inp.id);
    const v = parseFloat(el.value);
    if (!el.value || isNaN(v) || v <= 0) {
      el.style.borderColor = '#EF4444'; el.focus(); valid = false;
    } else {
      el.style.borderColor = '#10B981'; vals[inp.id] = v;
    }
  });
  if (!valid) return;
  const res = f.fn(vals);
  const isK = currentCalcType === 'keliling';
  document.getElementById('resultLabel').textContent = isK ? '📐 Keliling Bangun Datar' : '📏 Luas Bangun Datar';
  document.getElementById('resultValue').textContent = Number.isInteger(res) ? res : parseFloat(res.toFixed(4));
  document.getElementById('resultUnit').textContent = f.unit;
  document.getElementById('resultBox').classList.add('show');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('calcScreen').classList.contains('show')) hitung();
});
</script>
